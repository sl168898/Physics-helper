[General]
; 1: using a poison in Inventory or the updated Wheeler with a bow/crossbow immediately coats ONE bottle's batch.
; No dialog for clicking. Melee poisoning and other item use keep their normal behavior.
CraftOnPoisonUse=1
; DirectInput keyboard code. 66 = F8. Highlight a poison in Inventory to choose MULTIPLE bottles.
CraftKey=66
; Notify installed Immersive Interactions / New Anims after a successful batch.
; Uses the addon's own poison animation settings. 0 disables this optional bridge.
ImmersiveInteractionsBridge=1
; 0 asks the native Mod Poison Dose Count perk entry point (owner, weapon, poison).
; A value from 1 to 10000 overrides perks with a fixed arrows-per-bottle ratio.
ArrowsPerBottle=0
; One UI transaction is capped at this number of arrows/bolts.
MaxBatchArrows=5000
AutoEquip=1
; Enable for the beta's player/follower/impact tests; can produce a large log.
TraceProjectiles=0
