[General]
; 1: using a poison in Inventory with a bow/crossbow opens ammo crafting.
; Melee poisoning and other item use keep their normal behavior. F8 remains available.
CraftOnPoisonUse=1
; DirectInput keyboard code. 66 = F8. Highlight a poison in Inventory first.
CraftKey=66
; 0 asks the native Mod Poison Dose Count perk entry point (owner, weapon, poison).
; A value from 1 to 10000 overrides perks with a fixed arrows-per-bottle ratio.
ArrowsPerBottle=0
; One UI transaction is capped at this number of arrows/bolts.
MaxBatchArrows=5000
AutoEquip=1
; Enable for the beta's player/follower/impact tests; can produce a large log.
TraceProjectiles=0
