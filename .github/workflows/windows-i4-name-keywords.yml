name: Build I4 name keyword compatibility
on:
  workflow_dispatch:
  push:
    branches: ['codex/i4-weapon-oil-keywords']
permissions:
  contents: read
concurrency:
  group: i4-name-keywords-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Cache I4 dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: i4-windows2022-staticmd-a7b6122f-v1
      - name: Build and test I4 keyword matching
        shell: pwsh
        run: '& .\i4-name-rules\tools\build_windows.ps1'
      - name: Upload I4 component
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: InventoryInjector-Name-Keywords-v1-3
          path: i4-name-rules/_build/InventoryInjector_Name_Keywords_v1_3.zip
          if-no-files-found: error
