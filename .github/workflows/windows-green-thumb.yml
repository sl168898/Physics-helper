name: Build Green Thumb and Satchel
on:
  workflow_dispatch:
  push:
    branches: ['codex/green-thumb-20261001']
permissions:
  contents: read
concurrency:
  group: green-thumb-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: three-traits/native
            artifact: Green-Thumb-Mechanics-v1-8-0
            package: Biggie_Trait_Mechanics_v1.zip
          - project: venom-harvester
            artifact: Green-Thumb-Satchel-v2-0-13
            package: Huntsmans_Satchel_SKSE_v2_0_13_beta1.zip
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Cache vcpkg dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: waterskin-windows2022-staticmd-vcpkg-60b06921-v1
      - name: Build DLL and run tests
        shell: pwsh
        run: '& ./${{ matrix.project }}/tools/build_windows.ps1'
      - name: Upload native package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/_build/${{ matrix.package }}
          if-no-files-found: error
