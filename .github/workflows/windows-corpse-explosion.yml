name: Build Corpse Explosion Chain Reactions
on:
  workflow_dispatch:
  push:
    branches: ['codex/corpse-chain-20261002']
permissions:
  contents: read
concurrency:
  group: corpse-explosion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Cache vcpkg dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: waterskin-windows2022-staticmd-vcpkg-60b06921-v1
      - name: Build DLL and run native tests
        shell: pwsh
        run: '& ./venom-harvester/tools/build_windows.ps1'
      - name: Upload native package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Corpse-Explosion-Satchel-v2-2-0
          path: venom-harvester/_build/Corpse_Explosion_Satchel_SKSE_v2_2_0_beta1.zip
          if-no-files-found: error
