name: Build No Jarrin Planting SKSE
on:
  workflow_dispatch:
  push:
    branches: ['codex/no-jarrin-skse-v5']
permissions:
  contents: read
concurrency:
  group: no-jarrin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Cache vcpkg dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: waterskin-windows2022-staticmd-vcpkg-60b06921-v1
      - name: Build DLL and run slot policy tests
        shell: pwsh
        run: '& .\no-jarrin-native\tools\build_windows.ps1'
      - name: Upload native build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NoJarrinPlanting-v5-native
          path: no-jarrin-native/_build/NoJarrinPlanting_v5_native.zip
          if-no-files-found: error
