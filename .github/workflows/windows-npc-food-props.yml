name: Build NPC Food Prop Recovery
on:
  workflow_dispatch:
  push:
    branches: ['codex/npc-food-prop-recovery']
    paths: ['npc-food-prop-recovery/**', '.github/workflows/windows-npc-food-props.yml']
permissions:
  contents: read
concurrency:
  group: npc-food-props-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Cache vcpkg dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: waterskin-windows2022-staticmd-vcpkg-60b06921-v1
      - name: Build and test
        shell: pwsh
        run: '& .\npc-food-prop-recovery\tools\build_windows.ps1'
      - name: Upload installable test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: NPC-Food-Prop-Recovery-v0.1.0-test1
          path: npc-food-prop-recovery/_build/NPC_Food_Prop_Recovery_v0.1.0_test1_MO2.zip
          if-no-files-found: error
