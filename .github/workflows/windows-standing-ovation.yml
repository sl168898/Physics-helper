name: Build Standing Ovation SKSE
on:
  workflow_dispatch:
  push:
    branches: ['codex/standing-ovation-v1']
permissions:
  contents: read
concurrency:
  group: standing-ovation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Cache vcpkg dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: waterskin-windows2022-staticmd-vcpkg-60b06921-v1
      - name: Build DLL and run reward lifecycle tests
        shell: pwsh
        run: '& .\standing-ovation\tools\build_windows.ps1'
      - name: Upload native build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: StandingOvation-v1-native
          path: standing-ovation/_build/StandingOvation_v1_native.zip
          if-no-files-found: error
