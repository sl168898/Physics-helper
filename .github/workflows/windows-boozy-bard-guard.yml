name: Build Boozy Bard Guard
on:
  workflow_dispatch:
  push:
    branches: ['codex/phial-stable-bottles']
    paths:
      - 'boozy-bard-guard/**'
      - '.github/workflows/windows-boozy-bard-guard.yml'
permissions:
  contents: read
concurrency:
  group: boozy-bard-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: batch-windows2022-staticmd-vcpkg-60b06921-v2
          restore-keys: |
            phial-bank-windows2022-staticmd-vcpkg-60b06921-v1
            waterskin-windows2022-staticmd-vcpkg-60b06921-v1
      - name: Build Boozy Bard Guard and run policy tests
        shell: pwsh
        run: '& .\boozy-bard-guard\tools\build_windows.ps1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Boozy-Bard-Guard-v1-3-native
          path: boozy-bard-guard/_build/Boozy_Bard_Guard_v1_3_native.zip
          if-no-files-found: error
