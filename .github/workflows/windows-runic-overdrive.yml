name: Build Runic Overdrive
on:
  workflow_dispatch:
  push:
    branches: ['codex/runic-overdrive']
permissions:
  contents: read
concurrency:
  group: biggie-trait-mechanics-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: waterskin-windows2022-staticmd-vcpkg-60b06921-v1
      - name: Build DLL and test trait rules
        shell: pwsh
        run: '& .\three-traits\native\tools\build_windows.ps1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Runic-Overdrive-Native-v1-5
          path: three-traits/native/_build/Biggie_Trait_Mechanics_v1.zip
          if-no-files-found: error
