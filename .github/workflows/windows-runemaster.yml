name: Build Runemaster enchanted weapon compatibility
on:
  workflow_dispatch:
  push:
    branches: ['codex/runemaster-enchanted-weapons']
permissions:
  contents: read
concurrency:
  group: runemaster-enchanted-weapons-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Cache vcpkg dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: waterskin-windows2022-staticmd-vcpkg-60b06921-v1
      - name: Build DLL and run rune tests
        shell: pwsh
        run: '& .\runemaster-enchanted-weapons\tools\build_windows.ps1'
      - name: Upload installable rune compatibility patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Runemaster-Enchanted-Weapons-v1
          path: runemaster-enchanted-weapons/_build/Runemaster_Enchanted_Weapons_v1_0.zip
          if-no-files-found: error
