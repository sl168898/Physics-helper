name: Build Balanced Barter for SkyUI 6
on:
  workflow_dispatch:
  push:
    branches: ['codex/balanced-barter-skyui6']
permissions:
  contents: read
concurrency:
  group: balanced-barter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Cache vcpkg dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: waterskin-windows2022-staticmd-vcpkg-60b06921-v1
      - name: Build barter menu and native plugin
        shell: pwsh
        run: '& .\balanced-barter\tools\build_windows.ps1'
      - name: Upload installable mod
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Balanced-Barter-SkyUI6-v0-1
          path: balanced-barter/_build/Balanced_Barter_SkyUI6_v0_1.zip
          if-no-files-found: error
