; Soul Gem Auto Recharge - settings file.
; Put this file in Data/SKSE/Plugins/. It is read once when the game starts,
; so restart the game after editing it. Most players never need to change it:
; the in-game MCM covers the threshold and the protection switches.
[Probe]
; 0 turns the whole mod off without uninstalling it.
Enabled=1
; Manual recharge hotkey (DirectInput scan code). 87 = F11.
RechargeKey=87
; Diagnostic snapshot hotkey. 68 = F10. Writes to the log only.
SnapshotKey=68
MeasureHits=1
; One of the 14 Skyrim.esm soul gem forms. Default: Azura's Star.
GemFormID=0x00063B27
; 1 = plan and record only, never consume a soul gem. 0 = recharge for real.
; DryRun=1 only records what would happen and never consumes a soul gem. Keep 0 for normal play.
DryRun=0
ThresholdPercent=20
StarFirst=1
UseAzuraStar=1
UseBlackStar=1
UseSoulGems=1
PreserveBlackGems=1
PreserveGrand=0
RangedWeapons=1
DualWield=0
; 1 also recharges staves once a cast has finished. Default 0 = staves are
; never read and no staff animation listener is registered.
Staves=0

; Diagnostics only; ordinary bow and crossbow recharging follows RangedWeapons
; and is not affected by anything in this section.
[Ranged]
ReleaseProbe=0
; Consecutive unlinked hits, and the reused release grace period in milliseconds.
UnlinkedHitLimit=2
UnlinkedHitWindowMs=3000
; Diagnostics only: pass After releases, then drop Count releases once per
; process. After=0 disables it. Restart the game after changing these.
DiagDropReleaseAfter=0
DiagDropReleaseCount=2

; Diagnostics only. 1 records every player animation tag, player spell cast and
; equipped-staff read in the log. 0 = no staff listener and no such log rows.
[Staff]
TagProbe=0

[ExtraGems]
; Remove the leading ';' to enable a row. Rows are shipped disabled so that an update never turns on new behaviour.
; Rare Curios reusable soul gem.
;ExtraForm=ccbgssse037-curios.esl:0x000801
; Saints and Seducers soul gem pair.
;ExtraForm=ccbgssse025-advdsgs.esm:0x000804
